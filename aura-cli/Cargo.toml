[package]
name = "aura-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aura language CLI — compile and run .aura programs"

[[bin]]
name = "aura"
path = "src/main.rs"

[dependencies]
aura-bytecode.workspace = true
aura-compiler.workspace = true
aura-vm.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
serde_json = "1"
