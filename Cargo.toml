[workspace]
resolver = "2"
members = [
    "aura-bytecode",
    "aura-vm",
    "aura-compiler",
    "aura-cli",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["Aura Contributors"]

[workspace.dependencies]
aura-bytecode = { path = "aura-bytecode" }
aura-vm = { path = "aura-vm" }
aura-compiler = { path = "aura-compiler" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Opt-in profile for VM triage under GDB (tools/gdb/aura_gdb.py):
# release optimization plus DWARF for the crates the extension navigates
# by type. Kept out of the default release profile because debuginfo
# across the whole test-binary set does not fit constrained disks; build
# the triage binary on demand:
#   cargo build --profile gdb -p aura-cli   ->  target/gdb/aura
# split-debuginfo keeps DWARF in per-crate .dwo files rather than copied
# into every linked binary.
[profile.gdb]
inherits = "release"
split-debuginfo = "unpacked"
[profile.gdb.package.aura-vm]
debug = true
[profile.gdb.package.aura-bytecode]
debug = true
